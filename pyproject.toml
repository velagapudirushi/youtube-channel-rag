[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "youtube-channel-rag"
version = "1.0.0"
description = "Turn any YouTube channel into a searchable RAG knowledge base with ChromaDB, Hybrid Reranking, and Dual-Judge Evaluation."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Rushi Velagapudi" }
]
dependencies = [
    "youtube-transcript-api>=0.6.2",
    "yt-dlp>=2024.8.6",
    "openai>=1.40.0",
    "chromadb>=0.5.0",
    "streamlit>=1.35.0",
    "pydantic>=2.0.0",
    "httpx>=0.25.0",
    "rich>=13.0.0",
    "typer>=0.12.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src"]
